name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: btawg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: btawg/go.mod
      # The vendored µTP module keeps upstream formatting; check our module here.
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: test
        run: go test ./... -count=1 -timeout 300s
      - name: pure-Go uTP transport regressions
        working-directory: btawg/third_party/go-utp
        run: go test ./purego -run 'Test(CongestionAvoidanceAccumulatesSmallACKs|WideWindowSendsBeyond1024Packets|SlowStartGrowsWithAcknowledgedBytes|TransferOverLossyNetwork|UDPBatchDeliversValidTailAfterSendError)$' -count=1 -timeout 120s
      - name: test -race
        run: go test ./... -count=1 -race -timeout 600s

  windows-client:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: btawg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: btawg/go.mod
      - name: build Windows client bundle
        run: ./scripts/package-windows.ps1 -Version v0.0.0 -OutDir dist -Architecture amd64
      - name: test native Windows client surfaces
        run: ./scripts/test-windows.ps1 -Bundle dist/btawg-client-windows-amd64.zip
