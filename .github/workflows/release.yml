name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.arch }}
    defaults:
      run:
        working-directory: btawg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: btawg/go.mod
      - name: test before release
        run: go test ./... -count=1 -timeout 300s
      - name: build
        env:
          CGO_ENABLED: '0'
        run: |
          test "$(go env GOHOSTARCH)" = "$GOARCH"
          version_flags="-s -w -X bittorrent-tunnel/btawg/internal/service.Version=${GITHUB_REF_NAME}"
          mkdir -p dist
          for kind in server client; do
            name="btawg-$kind-linux-$GOARCH"
            go build -trimpath -ldflags "$version_flags" -o "dist/$name" "./cmd/btawg-$kind"
            test "$("dist/$name" --version)" = "$GITHUB_REF_NAME"
            (cd dist && sha256sum "$name") >> "dist/SHA256SUMS.linux-$GOARCH"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: btawg/dist/*
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        working-directory: btawg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: btawg/go.mod
      - run: ./scripts/package-windows.ps1 -Version $env:GITHUB_REF_NAME -OutDir dist -Architecture $env:RELEASE_ARCH
      - run: ./scripts/test-windows.ps1 -Bundle "dist/btawg-client-windows-$env:RELEASE_ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: btawg/dist/*
          if-no-files-found: error

  release:
    needs: [binaries, windows]
    runs-on: ubuntu-latest
    environment: windows-client-parity
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: verify exact approved Windows bundle
        working-directory: dist
        env:
          WINDOWS_11_VERIFIED_SHA256: ${{ secrets.WINDOWS_11_VERIFIED_SHA256 }}
        run: |
          set -eu
          actual=$(sha256sum btawg-client-windows-amd64.zip | cut -d' ' -f1)
          test "$actual" = "$WINDOWS_11_VERIFIED_SHA256"
      - name: package desktop launcher
        run: |
          python3 -m zipfile -c dist/btawg-desktop-launcher.zip btawg/scripts/start-btawg-client.cmd btawg/scripts/start-btawg-client.ps1
          (cd dist && sha256sum btawg-desktop-launcher.zip > SHA256SUMS.launcher)
      - name: verify all release assets
        working-directory: dist
        run: |
          cat SHA256SUMS.linux-amd64 SHA256SUMS.linux-arm64 SHA256SUMS.windows-amd64 SHA256SUMS.windows-arm64 SHA256SUMS.launcher > SHA256SUMS
          diff -u <(printf '%s\n' btawg-client-linux-amd64 btawg-client-linux-arm64 btawg-client-windows-amd64.zip btawg-client-windows-arm64.zip btawg-desktop-launcher.zip btawg-server-linux-amd64 btawg-server-linux-arm64) <(awk '{print $2}' SHA256SUMS | sort)
          sha256sum --strict -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/btawg-server-linux-amd64
            dist/btawg-client-linux-amd64
            dist/btawg-server-linux-arm64
            dist/btawg-client-linux-arm64
            dist/btawg-client-windows-amd64.zip
            dist/btawg-client-windows-arm64.zip
            dist/btawg-desktop-launcher.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
